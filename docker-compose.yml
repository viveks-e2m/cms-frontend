version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "3010:3000"
    environment:
      REACT_APP_API_URL: "http://localhost:8001"
      NODE_ENV: "development"
    networks:
      - wp-overlay
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "2000m"

networks:
  wp-overlay:
    external: true
